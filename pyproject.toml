[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nrl-lib"
dynamic = ["version"]
description = "Python client for the EarthScope Nominal Response Library (NRL) v2 web service"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "AUTHORS.rst"]
authors = [
    { name = "EPIC", email = "software@earthscope.org" },
]
keywords = ["nrl", "nominal response library", "seismology", "instrument response", "stationxml", "earthscope"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "requests",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "flake8",
    "tox",
    "mypy",
    "coverage",
    "genbadge",
    "types-requests",
    "types-PyYAML",
]

[project.urls]
Homepage = "https://epic.earthscope.org/content/software-resources"
Repository = "https://github.com/EarthScope/nrl-lib"
Documentation = "https://github.com/EarthScope/nrl-lib/blob/main/README.md"
Changelog = "https://github.com/EarthScope/nrl-lib/blob/main/HISTORY.rst"
Issues = "https://github.com/EarthScope/nrl-lib/issues"

[tool.setuptools.dynamic]
version = { attr = "nrl.__version__" }

[tool.setuptools.packages.find]
include = ["nrl", "nrl.*"]

[tool.setuptools.package-data]
"nrl.logging_setup" = ["logging.config"]
