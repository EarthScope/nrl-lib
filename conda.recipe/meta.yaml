package:
  name: nrl-lib
  version: 1.0.0

source:
  path: ../

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install --no-deps -vv .

requirements:
  host:
    - python >=3.11
    - pip
    - setuptools >=77
  run:
    - python >=3.11
    - requests
    - pyyaml

test:
  imports:
    - nrl
  source_files:
    - tests
  commands:
    - python -m unittest

about:
  home: https://epic.earthscope.org/content/software-resources
  dev_url: https://github.com/EarthScope/nrl-lib
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: Library to access the NRL v2 web service.
