package:
  name: nrl
  version: 2024.1.0.0

source:
  path: ../

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install --no-deps -vv .

requirements:
  build:
    - python >=3.9
    - pip
  run:
    - python >=3.9
    - configobj

test:
  source_files:
    - tests
  commands:
    - python -m unittest

about:
  home: https://www.passcal.nmt.edu/content/software-resources
  dev_url: https://git.passcal.nmt.edu/software_public/nrl
  license: GPLv3
  license_file: LICENSE
  summary: Library to access the NRL v2 web service.

