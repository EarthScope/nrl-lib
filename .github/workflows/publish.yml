name: Publish to PyPI

# Runs when a version tag such as v1.0.1 is pushed. Uploads use PyPI
# Trusted Publishing, so no API token is stored in the repository.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Check that the tag matches the package version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ ! -f "dist/nrl_lib-${version}.tar.gz" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match the built version:"
            ls dist
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/nrl-lib/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
